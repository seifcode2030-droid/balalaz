<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الأدمن</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css">

    <style>
        #videosTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
        }

        #videosTable th,
        #videosTable td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        #videosTable th {
            background: #2c3e50;
            color: white;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        .delete-btn:hover {
            opacity: .8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            font-family: Arial, sans-serif;
            direction: rtl;
            background: #f4f6f9;
            padding: 30px;
        }

        h1,
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            width: 30%;
            margin: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #007bff;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            background: #000;
            color: white;
            width: 100%;
        }

        button:hover {
            opacity: .9;
        }
    </style>
</head>

<body>

    <h1>لوحة التحكم</h1>

    <div class="card">
        <div class="card-body">
            <h5 style="text-align:center;">عدد الطلاب</h5>
            <h2 id="usersCount"></h2>
        </div>
    </div>

    <!-- إضافة مستخدم -->

    <form action="/add-user" method="POST">

        <h2>إضافة مستخدم</h2>

        <input type="text" name="name" placeholder="اسم الطالب" required>

        <input type="email" name="email" placeholder="البريد الإلكتروني" required>

        <input type="password" name="password" placeholder="كلمة المرور" required>

        <select name="className" required>
            <option value="">اختر الصف</option>

            <option value="first">الأولى الإعدادي</option>
            <option value="second">الثانية الإعدادي</option>
            <option value="third">الثالثة الإعدادي</option>

            <option value="fourth">الرابع الابتدائي</option>
            <option value="fifth">الخامس الابتدائي</option>
            <option value="sixth">السادس الابتدائي</option>

            <option value="firsts">الأول الثانوي</option>
            <option value="seconds">الثاني الثانوي</option>
            <option value="thirds">الثالث الثانوي</option>
        </select>

        <select name="subject" required>
            <option value="">اختر المادة</option>

            <option value="science">علوم</option>
            <option value="social">دراسات</option>
        </select>

        <button type="submit">
            إضافة مستخدم
        </button>

    </form>

    <!-- جدول المستخدمين -->

    <h2>المستخدمون</h2>

    <table border="1">
        <thead>
            <tr>
                <th>البريد الإلكتروني</th>
                <th>الصف</th>
                <th>تاريخ الإنشاء</th>
                <th>حذف</th>
            </tr>
        </thead>

        <tbody id="usersTable"></tbody>
    </table>

    <br><br>

    <!-- إضافة فيديو -->

    <form id="videoForm">

        <h2>إضافة فيديو</h2>

        <input type="text" id="title" placeholder="عنوان الفيديو" required>

        <input type="url" id="videoUrl" placeholder="رابط الفيديو" required>

        <select id="videoClass" required>
            <option value="">اختر الصف</option>

            <option value="firsts">الأول الثانوي</option>
            <option value="seconds">الثاني الثانوي</option>
            <option value="thirds">الثالث الثانوي</option>
            <option value="first">الاول الاعدادي</option>
            <option value="second">الثاني الاعدادي</option>
            <option value="third">الثالث الاعدادي</option>
            <option value="fourth">الرابع الابتدائي</option>
            <option value="fifth">الخامس الابتدائي</option>
            <option value="sixth">السادس الابتدائي</option>
        </select>

        <select id="videoSubject" required>
            <option value="">اختر المادة</option>

            <option value="science">علوم</option>
            <option value="social">دراسات</option>
        </select>

        <button type="submit">
            إضافة فيديو
        </button>

    </form>

    <h2>الفيديوهات المضافة</h2>

    <table id="videosTable">
        <thead>
            <tr>
                <th>العنوان</th>
                <th>الصف</th>
                <th>المادة</th>
                <th>حذف</th>
            </tr>
        </thead>

        <tbody id="videosBody">

        </tbody>
    </table>

    <script src="/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>

</body>

</html>
