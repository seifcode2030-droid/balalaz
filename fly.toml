# استخدام أحدث إصدار مستقر من Node.js
FROM node:20-slim

# إنشاء مجلد العمل داخل الحاوية
WORKDIR /app

# نسخ ملفات اعتماد المشروع أولاً لتحسين التخزين المؤقت
COPY package*.json ./

# تثبيت الاعتماديات (production فقط إذا أردت، أو الكل)
RUN npm install

# نسخ باقي ملفات المشروع
COPY . .

# تحديد المنفذ الذي يعمل عليه التطبيق (تأكد أنه يطابق منفذ مشروعك، غالباً 3000)
EXPOSE 3000

# أمر تشغيل التطبيق (تأكد أن الملف الأساسي هو app.js أو server.js أو حسب مشروعك)
CMD ["npm", "start"]